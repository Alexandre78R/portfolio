services:
  backend:
    #image: alexandre78r/dev-backend-portfolio:latest
    build: ./backend
    ports:
      - 4011:4000
    volumes:
      - ./backend/src:/app/src
      - ./backend/translations:/app/translations
      - ./backend/backups:/app/backups
      - ./backend/doc/cv:/app/doc/cv
      - ./backend/uploads/images:/app/uploads/images
      - ./backend/uploads/videos:/app/uploads/videos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WDS_SOCKET_HOST=127.0.0.1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
        #depends_on:
        #db:
        #condition: service_healthy
    env_file:
      - ./.env
      
  frontend:
    #image: alexandre78r/dev-frontend-portfolio:latest
    build:
      context: ./frontend
      args:
       NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN}
       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
       NEXT_PUBLIC_JWT_SECRET: ${NEXT_PUBLIC_JWT_SECRET}
       JWT_SECRET: ${JWT_SECRET}
    ports:
      - 3001:3000
    environment:
      - WDS_SOCKET_HOST=127.0.0.1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_IMAGE_URL=http://localhost:8011
      - NEXT_PUBLIC_API_TOKEN=${NEXT_PUBLIC_API_TOKEN}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_JWT_SECRET=${NEXT_PUBLIC_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - API_URL=${API_URL}
      - NODE_ENV=development
    env_file:
      - ./.env
    depends_on:
      - backend

  nginx:
    image: nginx:1.25.5-alpine
    depends_on:
      - frontend
      - backend
    restart: always
    ports:
      - ${GATEWAY_PORT:-8011}:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx-dev
