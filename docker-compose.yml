services:
  # db:
  #   image: mysql:8.0
  #   container_name: portfolio-db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: portfolio
  #   ports:
  #     - 3307:3306
