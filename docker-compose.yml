  #     - portfolio-data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     timeout: 20s
  #     retries: 10

  backend:
    build: ./backend
    ports:
      - 4000:4000
    volumes:
      - ./backend/src:/app/src
      - ./backend/backups:/app/backups
      - ./backend/uploads/cv:/app/uploads/cv
      - ./backend/uploads/images:/app/uploads/images
      - ./backend/uploads/videos:/app/uploads/videos
      # - ./backend/node_modules:/app/node_modules 
      
    environment:
      - WDS_SOCKET_HOST=127.0.0.1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true 

    env_file:
      - ./backend/.env
    # depends_on:
    #   db:
    #     condition: service_healthy

  frontend:
    # build: ./frontend
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_TOKEN: ${NEXT_PUBLIC_API_TOKEN}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_JWT_SECRET: ${NEXT_PUBLIC_JWT_SECRET}
        JWT_SECRET: ${JWT_SECRET}
    ports:
      - 3000:3000
    volumes:
      - ./frontend/src:/app/src
    environment:
      - WDS_SOCKET_HOST=127.0.0.1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_IMAGE_URL=http://localhost:8000
      - NEXT_PUBLIC_API_TOKEN=${NEXT_PUBLIC_API_TOKEN}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_URL=${API_URL}
      - NODE_ENV=development
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
